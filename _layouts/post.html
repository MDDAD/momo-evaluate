---
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — AI 好物評價網</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl | default: '/' }}/assets/css/main.css">
</head>
<body>

  <header class="site-header">
    <div class="site-logo">AI 好物評價網 <span>評測・開箱・導購</span></div>
  </header>

  <div class="layout-main">
    <section class="main-content" style="max-width:900px;margin:0 auto;">

      <a href="{{ site.baseurl | default: '/' }}/" style="display:inline-flex;align-items:center;gap:6px;font-size:0.88rem;color:var(--text-secondary);margin-bottom:20px;transition:0.2s;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-secondary)'">← 回首頁</a>

      <header class="post-header">
        {% if page.category %}<span class="post-cat-tag">{{ page.category }}</span>{% endif %}
        <h1 class="post-title">{{ page.title }}</h1>
        {% if page.date %}<p class="post-meta">發布於 {{ page.date | date: "%Y/%m/%d" }}</p>{% endif %}
      </header>

      <div class="post-content-wrap">
        {{ content }}
      </div>

    </section>
  </div>

  <footer class="site-footer">
    <p>AI 好物評價網 — 透過 <a href="https://momo.com">MOMO 購物網</a> 發現好物</p>
  </footer>

</body>
</html>
