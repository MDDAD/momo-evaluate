---
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — AI 好物評價網</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl | default: '/' }}/assets/css/main.css">
</head>
<body>

  <header class="site-header">
    <div class="site-logo">AI 好物評價網 <span>評測・開箱・導購</span></div>
  </header>

  <div class="post-layout">
    <a href="{{ site.baseurl | default: '/' }}/" class="back-link">← 回首頁</a>

    <article>
      <header class="post-header">
        {% if page.category %}<span class="post-cat-tag">{{ page.category }}</span>{% endif %}
        <h1 class="post-title">{{ page.title }}</h1>
        {% if page.date %}<p class="post-meta">發布於 {{ page.date | date: "%Y/%m/%d" }}</p>{% endif %}
      </header>

      <div class="post-content-inner">
        <div class="post-content-wrap">
          {{ content }}
        </div>
      </div>
    </article>
  </div>

  <footer class="site-footer">
    <p>AI 好物評價網 — 發現好物</p>
  </footer>

</body>
</html>
