---
layout: home
---
<style>
  .product-card { border: 1px solid #ddd; padding: 15px; margin: 10px; border-radius: 8px; display: inline-block; width: 250px; vertical-align: top; text-align: center; }
  .product-card img { width: 100%; height: 200px; object-fit: contain; border-radius: 4px; }
  .product-card h3 { font-size: 16px; margin-top: 10px; color: #333; }
</style>

<input type="text" id="searchInput" onkeyup="searchFunction()" placeholder="搜尋商品名稱..." style="width:100%; padding: 10px; margin-bottom: 20px;">
<div id="productGrid">
  {% for post in site.posts %}
    <div class="product-card">
      <a href="{{ post.url | relative_url }}">
        <img src="{{ post.image }}" alt="{{ post.title }}">
        <h3>{{ post.title }}</h3>
      </a>
    </div>
  {% endfor %}
</div>

<script>
function searchFunction() {
  var input = document.getElementById("searchInput");
  var filter = input.value.toUpperCase();
  var grid = document.getElementById("productGrid");
  var cards = grid.getElementsByClassName("product-card");
  for (var i = 0; i < cards.length; i++) {
    var title = cards[i].getElementsByTagName("h3")[0];
    if (title.textContent.toUpperCase().indexOf(filter) > -1) {
      cards[i].style.display = "";
    } else {
      cards[i].style.display = "none";
    }
  }
}
</script>
