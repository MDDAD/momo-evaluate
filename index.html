---
layout: home
---
<style>
  .product-row { display: flex; align-items: center; border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
  .product-row img { width: 300px; height: 200px; object-fit: cover; border-radius: 4px; margin-right: 20px; }
  .product-info { flex: 1; }
  .product-info h3 { margin-top: 0; font-size: 22px; color: #333; }
</style>

<input type="text" id="searchInput" onkeyup="searchFunction()" placeholder="搜尋商品名稱..." style="width:100%; padding: 10px; margin-bottom: 20px;">
<div id="productGrid">
  {% for post in site.posts reversed %}
    <div class="product-row">
      <img src="{{ post.image }}" alt="{{ post.title }}">
      <div class="product-info">
        <a href="{{ post.url | relative_url }}">
          <h3>{{ post.title }}</h3>
        </a>
        <p>{{ post.excerpt | strip_html | truncate: 100 }}</p>
      </div>
    </div>
  {% endfor %}
</div>

<script>
function searchFunction() {
  var input = document.getElementById("searchInput");
  var filter = input.value.toUpperCase();
  var rows = document.getElementsByClassName("product-row");
  for (var i = 0; i < rows.length; i++) {
    var title = rows[i].getElementsByTagName("h3")[0];
    if (title.textContent.toUpperCase().indexOf(filter) > -1) {
      rows[i].style.display = "";
    } else {
      rows[i].style.display = "none";
    }
  }
}
</script>
