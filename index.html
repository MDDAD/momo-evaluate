<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 好物評價網</title>
  <style>
    body { font-family: sans-serif; padding: 15px; margin: 0; }
    h1 { text-align: center; color: #333; }
    #searchInput { width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box; }
    .product-row { display: flex; align-items: flex-start; border-bottom: 1px solid #eee; padding: 15px 0; }
    .product-row img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; margin-right: 15px; flex-shrink: 0; }
    .product-info { flex: 1; min-width: 0; }
    .product-info h3 { margin: 0 0 5px 0; font-size: 16px; color: #333; }
    .product-info p { margin: 0; font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <h1>AI 好物評價網</h1>
  <input type="text" id="searchInput" onkeyup="searchFunction()" placeholder="搜尋商品名稱...">
  <div id="productGrid">
    
      <div class="product-row">
        <img src="https://i8.momoshop.com.tw/1769163801/goodsimg/TP000/6348/0000/417/TP00063480000417_R_m.jpg" alt="【深度評測】Lami Fans 140W GaN 氮化鎵四孔快充">
        <div class="product-info">
          <a href="/2026/05/15/lami-fans-140w/" style="text-decoration:none;">
            <h3>【深度評測】Lami Fans 140W GaN 氮化鎵四孔快充</h3>
          </a>
          <p>這款 Lami Fans 140W GaN 氮化鎵充电器，憑藉其高達 140W 的輸出功率與四孔設計，成為近期商務人士與筆電用戶的熱門關注商品。</p>
        </div>
      </div>
    
      <div class="product-row">
        <img src="https://i7.momoshop.com.tw/1723837157/expertimg/TP000/2179/0000/669/TP00021790000000_m_1_1.jpg" alt="【玩具開箱】1:18 台灣配音警車">
        <div class="product-info">
          <a href="/2026/05/15/taiwan-police-car/" style="text-decoration:none;">
            <h3>【玩具開箱】1:18 台灣配音警車</h3>
          </a>
          <p>這款 1:18 比例的台灣警車玩具，憑藉其逼真的「台灣小朋友配音」與聲光效果，成為許多家長選購兒童玩具的首選。</p>
        </div>
      </div>
    
  </div>

  <script>
    function searchFunction() {
      var input = document.getElementById("searchInput");
      var filter = input.value.toUpperCase();
      var rows = document.getElementsByClassName("product-row");
      for (var i = 0; i < rows.length; i++) {
        var title = rows[i].getElementsByTagName("h3")[0];
        if (title.textContent.toUpperCase().indexOf(filter) > -1) {
          rows[i].style.display = "";
        } else {
          rows[i].style.display = "none";
        }
      }
    }
  </script>
</body>
</html>
