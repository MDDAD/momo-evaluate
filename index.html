---
layout: null
---
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 好物評價網 — 評測・開箱・導購</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>

  <header class="site-header">
    <div class="site-logo">AI 好物評價網 <span>評測・開箱・導購</span></div>
  </header>

  <main class="container">
    <h1 class="page-title">精選評測</h1>
    <p class="page-subtitle">為你嚴選的生活好物，完整開箱與使用心得</p>

    <div class="search-wrap">
      <input type="text" id="searchInput" onkeyup="searchFunction()" placeholder="🔍 搜尋感興趣的商品...">
    </div>

    <div id="productGrid">
      {% for post in site.posts %}
        <div class="product-row">
          <a href="{{ post.url | relative_url }}">
            <img class="product-row-img" src="{{ post.image }}" alt="{{ post.title }}">
          </a>
          <div class="product-row-info">
            <a href="{{ post.url | relative_url }}">
              <h3 class="product-row-title">{{ post.title }}</h3>
            </a>
            <p class="product-row-excerpt">{{ post.excerpt | strip_html | truncate: 80 }}</p>
            {% if post.category %}<span class="product-row-cat">{{ post.category }}</span>{% endif %}
          </div>
        </div>
      {% endfor %}
    </div>

    <div id="noResults" class="no-results" style="display:none;">
      找不到符合的商品，試試其他關鍵字 🙂
    </div>
  </main>

  <footer class="site-footer">
    <p>AI 好物評價網 — 透過 <a href="https://momo.com">MOMO 購物網</a> 發現好物</p>
  </footer>

  <script>
    function searchFunction() {
      var input = document.getElementById("searchInput");
      var filter = input.value.toUpperCase();
      var rows = document.getElementsByClassName("product-row");
      var visible = 0;
      for (var i = 0; i < rows.length; i++) {
        var title = rows[i].getElementsByClassName("product-row-title")[0];
        var excerpt = rows[i].getElementsByClassName("product-row-excerpt")[0];
        var txt = (title.textContent + " " + excerpt.textContent).toUpperCase();
        if (txt.indexOf(filter) > -1) {
          rows[i].style.display = "";
          visible++;
        } else {
          rows[i].style.display = "none";
        }
      }
      document.getElementById("noResults").style.display = (visible === 0) ? "block" : "none";
    }
  </script>

</body>
</html>
